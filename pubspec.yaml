name: dice_roller2
description: "Dice Roller - a fun multi-player dice game with customizable settings, animations, and sound effects."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  package_info_plus: ^8.3.0
  shared_preferences: ^2.3.4
  flutter_animate: ^4.5.0
  upgrader: ^11.5.0
  flutter_launcher_icons: ^0.14.4
  audioplayers: ^6.6.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/sound.mp3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"